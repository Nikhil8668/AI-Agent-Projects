<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Book Summary Generator</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f6fb;
            color: #1f2937;
            padding: 16px;
        }
        .card {
            width: 100%;
            max-width: 480px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 32px;
        }
        h1 { margin: 0 0 8px; font-size: 1.6rem; }
        p.subtitle { margin: 0 0 24px; color: #6b7280; }
        .flash {
            padding: 12px;
            border-radius: 8px;
            background: #e0f2fe;
            color: #075985;
            margin-bottom: 16px;
        }
        .drop-zone {
            display: block;
            border: 2px dashed #c7d2fe;
            border-radius: 10px;
            padding: 32px 16px;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .drop-zone:hover, .drop-zone.dragover { background: #eef2ff; border-color: #6366f1; }
        .drop-zone input { display: none; }
        .drop-zone .hint { color: #6b7280; font-size: 0.9rem; margin-top: 6px; }
        #file-name { margin-top: 12px; font-weight: 600; color: #4f46e5; word-break: break-all; }
        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            background: #4f46e5;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover { background: #4338ca; }
        button:disabled { background: #a5b4fc; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="card">
        <h1>📚 AI Book Summary Generator</h1>
        <p class="subtitle">Upload a book (PDF) and get an AI-generated summary.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="flash">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form action="{{ url_for('upload_file') }}" method="POST" enctype="multipart/form-data" id="upload-form">
            <label class="drop-zone" id="drop-zone">
                <input type="file" name="bookfile" id="bookfile" accept=".pdf" required>
                <div>Click to choose a file or drag it here</div>
                <div class="hint">Allowed: .pdf</div>
                <div id="file-name"></div>
            </label>
            <button type="submit" id="submit-btn">Upload &amp; Summarize</button>
        </form>
    </div>

    <script>
        const input = document.getElementById("bookfile");
        const dropZone = document.getElementById("drop-zone");
        const fileName = document.getElementById("file-name");

        input.addEventListener("change", () => {
            fileName.textContent = input.files.length ? input.files[0].name : "";
        });

        ["dragover", "dragenter"].forEach(evt =>
            dropZone.addEventListener(evt, e => { e.preventDefault(); dropZone.classList.add("dragover"); })
        );
        ["dragleave", "drop"].forEach(evt =>
            dropZone.addEventListener(evt, () => dropZone.classList.remove("dragover"))
        );
        dropZone.addEventListener("drop", e => {
            e.preventDefault();
            input.files = e.dataTransfer.files;
            input.dispatchEvent(new Event("change"));
        });

        document.getElementById("upload-form").addEventListener("submit", () => {
            const btn = document.getElementById("submit-btn");
            btn.disabled = true;
            btn.textContent = "Uploading...";
        });
    </script>
</body>
</html>
